name: Compilar APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    name: Generar APK de pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de pruebas
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: MotionCaptureStudioPro-Alpha-0.5.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
