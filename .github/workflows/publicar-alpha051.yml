name: Publicar Alpha 0.5.1 Smart Mouth APK

on:
  push:
    branches: [feature/alpha-0.5.1-smart-mouth]
    paths:
      - '.github/workflows/publicar-alpha051.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-release:
    name: Compilar y publicar APK Android directo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MotionCaptureStudioPro_Alpha_0_5_1.apk
      - name: Descargar APK desde GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.5.1-alpha
          target_commitish: feature/alpha-0.5.1-smart-mouth
          name: Motion Capture Studio Pro - Alpha 0.5.1 Smart Mouth
          draft: false
          prerelease: true
          body: |
            Smart Mouth Layer Alpha 0.5.1:
            - Corregida mascara rectangular (DST_IN sobre toda la capa).
            - Foto de boca abierta: modo automatico, recorte o rostro completo.
            - Apertura ligada a anclas de labios y comisuras.
            - Transicion progresiva y bordes transparentes.
            - Se conserva Alpha 0.5 Preview separada.
            No incluye imagenes personales; la boca alternativa se carga localmente.
            APK experimental debug, pendiente de prueba visual.
          files: MotionCaptureStudioPro_Alpha_0_5_1.apk
          fail_on_unmatched_files: true
