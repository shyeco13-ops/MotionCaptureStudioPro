name: Face Capture Alpha 0.5.4 - APK de prueba

on:
  push:
    branches:
      - feature/alpha-0.5.4-progressive-mouth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK de prueba
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK de prueba
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FaceCapture-Alpha-0.5.4-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
